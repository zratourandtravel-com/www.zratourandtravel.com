name: Update ZRA Services
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Services section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          new = '''<section id="services"><div class="container"><div class="section-head"><span class="kicker">What ZRA does</span><h2>Don’t search alone. Let ZRA help you move forward.</h2><p>From finding suitable opportunities to preparing and following your application, ZRA gives you practical, professional support through the international job-search process.</p></div><div class="cards"><div class="card"><div class="icon">🔎</div><h3>WE SEARCH</h3><p>We search for suitable international job opportunities based on your profile, skills, experience and preferred destination.</p></div><div class="card"><div class="icon">📄</div><h3>WE PREPARE</h3><p>We prepare your professional CV, cover letter and application information so your profile is ready for the opportunity.</p></div><div class="card"><div class="icon">📤</div><h3>WE SUBMIT</h3><p>With your authorization, we help submit applications through the appropriate recruitment or employer application route.</p></div><div class="card"><div class="icon">📊</div><h3>WE TRACK</h3><p>We help follow application progress and keep you informed about updates, requirements and next steps.</p></div><div class="card"><div class="icon">🌟</div><h3>VISA-SPONSORED OPPORTUNITIES</h3><p>When suitable vacancies offering employer sponsorship are available, we help you identify and apply for them. Sponsorship is never guaranteed.</p></div><div class="card"><div class="icon">🎓</div><h3>SCHOLARSHIPS & STUDY ABROAD</h3><p>Explore suitable study and scholarship opportunities with guidance on requirements and the application process.</p></div><div class="card"><div class="icon">✈️</div><h3>VISA & WORK-PERMIT GUIDANCE — $50</h3><p>Understand documents, application steps and work-permit or visa processes. This is ZRA’s service fee, not a government visa fee.</p></div><div class="card"><div class="icon">💼</div><h3>FULL JOB SEARCH & APPLICATION SUPPORT — $100</h3><p>Our full package brings together search, CV and application preparation, authorized submission, tracking and guidance.</p></div></div><div class="notice" style="margin-top:24px"><strong>SEARCH • PREPARE • SUBMIT • TRACK • GUIDE</strong><br>Educated or not — don’t give up on your future. No job, sponsorship, scholarship or visa outcome is guaranteed; final decisions are made by employers, institutions and relevant authorities.</div></div></section>'''
          pattern = r'<section id="services">.*?</section>'
          s2, n = re.subn(pattern, new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Services section not found; no changes made.')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit website change and remove temporary workflow
        run: |
          git config user.name "ZRA Website Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/update-zra-services.yml
          git commit -m "Update ZRA services and application support" || exit 0
          git push
